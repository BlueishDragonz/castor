# Reference deployment — mirrors the apollo production stack.
# The live copy on the host is /opt/castor/docker-compose.yml; keep the
# two in sync (image tag + volume name will differ per environment).
#
# Real secrets live in .user/.secrets.env INSIDE the data volume
# (the container loads them at startup via castor/configs.py). Nothing
# secret goes in this file.

services:
  castor:
    image: castor:custom-2026-09-26-f1   # PIN a custom tag — never :latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: castor
    network_mode: "container:wg-easy"  # share the VPN's network namespace
    environment:
      - HABITS_STORAGE=DATABASE
      # ─── WebAuthn ────────────────────────────────────────────────
      # rpId MUST match the host the browser hits (slice-19 runbook §5).
      - WEBAUTHN_RP_ID=10.8.0.1
      - WEBAUTHN_ORIGIN=http://10.8.0.1:8080
      # ─── Backend routing ─────────────────────────────────────────
      # BACKEND_URL points Astro at the in-container backend (the image
      # supervisor runs gunicorn on 127.0.0.1:8081). Browser-callable
      # backend paths (/auth/webauthn/*, /users/*, /webauthn/*, /health)
      # are proxied to it by Astro middleware in production.
      - BACKEND_URL=http://127.0.0.1:8081
      # ─── Frontend origin (invite-link URLs, redirects) ───────────
      - FRONTEND_URL=http://10.8.0.1:8080
      # ─── Monitoring (F13) ────────────────────────────────────────
      # The DSN is a public ingest key, not a secret, so it is safe here.
      # It is passed to the Astro build/runtime and to the Python backend,
      # which is what makes an OOM kill or a post-deploy crash visible to an
      # operator instead of to a user.
      #
      # F11 posture: `send_default_pii` stays False everywhere. Sentry's
      # defaults would attach request bodies, headers and client IPs to every
      # event, and this app handles passwords, recovery codes and habit data.
      # Enabling telemetry must be a deliberate act, not a side effect of
      # setting a DSN.
      - SENTRY_DSN=https://194746b78af1d5c8a76844097430dad8@o4512052468514816.ingest.de.sentry.io/4512154770407504
      - PUBLIC_SENTRY_DSN=https://194746b78af1d5c8a76844097430dad8@o4512052468514816.ingest.de.sentry.io/4512154770407504
      - SENTRY_SEND_PII=false
      # Secrets (JWT_SECRET, RESET_PASSWORD_TOKEN_SECRET,
      # NICEGUI_STORAGE_SECRET, SMTP_EMAIL_USERNAME/PASSWORD) come from
      # .user/.secrets.env inside the volume — set them there.
    volumes:
      - beaverhabits_beaver_data:/app/.user/
    restart: unless-stopped

    # ─── F3: resource limits ─────────────────────────────────────────────
    # Measured on apollo 2026-09-26 from
    # /sys/fs/cgroup/<castor-scope>/memory.{current,peak}:
    #   current 95 MiB, peak 332 MiB, limit max (unbounded), host 954 MB
    # with pihole + wg-easy also resident.
    #
    # 640m sits ~2x above observed peak, so normal operation and the F5 fix's
    # bounded cache both fit with headroom, but a genuine leak or runaway
    # request is contained before it can starve the host. The important part
    # is not the number but that there IS a ceiling: the kernel's OOM killer
    # otherwise picks the largest RSS process on the box, which may well be
    # pihole or wg-easy rather than castor. With a cgroup limit, castor is the
    # only thing that dies.
    #
    # An OOM kill is now survivable rather than silent: writes are durable
    # before they are acknowledged (F2) and there is an off-host backup (F1).
    # pids_limit bounds fork bombs; the service needs ~10 processes.
    mem_limit: 640m
    pids_limit: 100
    # Drop every capability, then re-add only what is genuinely needed.
    # The container runs as `nobody` and listens on 8080 (>1024), so it needs
    # no NET_BIND_SERVICE, and nothing here requires CHOWN/DAC_OVERRIDE
    # because the volume is chowned to nobody at image build time.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # F13: no log rotation was configured anywhere, so the json-file driver
    # grew without bound. 10m x 3 files caps the container log at ~30 MB while
    # still keeping enough history to see an OOM kill and the restart that
    # followed it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # F8: this now checks real readiness, not a hardcoded "OK". It must fail
      # when the database is unreachable, otherwise Docker keeps reporting the
      # container healthy through exactly the failure it exists to detect.
      test: ["CMD-SHELL", "python healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      # F3/F8: the application takes ~42s to reach "Application startup complete"
      # before it binds. A short start_period makes every restart look like a
      # failure, so this must exceed the real cold-start time — the image's own
      # HEALTHCHECK sets 90s, and compose overrides it, so the two are kept
      # identical deliberately. An earlier 20s here produced three spurious
      # unhealthy results on every boot.
      start_period: 90s

volumes:
  # NOTE the name. Production does not use `castor_data`; the live volume is
  # `beaverhabits_beaver_data`, which holds every account, habit and secret.
  #
  # Declared `external: true` so compose will NEVER create it. If the name is
  # wrong, compose fails loudly with "external volume not found" rather than
  # silently creating an empty one — and then starting a container with no
  # data in it, which looks like a working deploy until someone opens the
  # site and finds an empty app.
  #
  # That is not hypothetical: this exact mismatch was hit during the cutover
  # and caught only because `external: true` did its job.
  beaverhabits_beaver_data:
    external: true
