# Reference deployment — mirrors the apollo production stack.
# The live copy on the host is /opt/castor/docker-compose.yml; keep the
# two in sync (image tag + volume name will differ per environment).
#
# Real secrets live in .user/.secrets.env INSIDE the castor_data volume
# (the container loads them at startup via castor/configs.py). Nothing
# secret goes in this file.

services:
  castor:
    image: castor:custom-2026-09-XX   # PIN a custom tag — never :latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: castor
    network_mode: "container:wg-easy"  # share the VPN's network namespace
    environment:
      - HABITS_STORAGE=DATABASE
      # ─── WebAuthn ────────────────────────────────────────────────
      # rpId MUST match the host the browser hits (slice-19 runbook §5).
      - WEBAUTHN_RP_ID=10.8.0.1
      - WEBAUTHN_ORIGIN=http://10.8.0.1:8080
      # ─── Backend routing ─────────────────────────────────────────
      # BACKEND_URL points Astro at the in-container backend (the image
      # supervisor runs gunicorn on 127.0.0.1:8081). Browser-callable
      # backend paths (/auth/webauthn/*, /users/*, /webauthn/*, /health)
      # are proxied to it by Astro middleware in production.
      - BACKEND_URL=http://127.0.0.1:8081
      # ─── Frontend origin (invite-link URLs, redirects) ───────────
      - FRONTEND_URL=http://10.8.0.1:8080
      # Secrets (JWT_SECRET, RESET_PASSWORD_TOKEN_SECRET,
      # NICEGUI_STORAGE_SECRET, SMTP_EMAIL_USERNAME/PASSWORD) come from
      # .user/.secrets.env inside the volume — set them there.
    volumes:
      - castor_data:/app/.user/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  castor_data:
    external: true
