services:
  castor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: castor                        # renamed from 'beaverhabits' at cutover (slice-19 runbook §7)
    network_mode: "container:wg-easy"
    image: castor:custom-2026-09-XX             # PIN a custom tag — never :latest
    environment:
      - HABITS_STORAGE=DATABASE
      # ─── WebAuthn ────────────────────────────────────────────────
      # rpId MUST match the host the browser hits. VPN clients hit
      # 10.8.0.1:8080, so the rpId is 10.8.0.1. Legacy value
      # (localhost) only worked for sessions on the apollo host
      # itself; VPN sessions would fail rpId validation on new
      # passkey registrations. See slice-19 cutover runbook §5.
      - WEBAUTHN_RP_ID=10.8.0.1
      - WEBAUTHN_ORIGIN=http://10.8.0.1:8080
      # ─── Backend routing ─────────────────────────────────────────
      # BACKEND_URL points Astro at the in-container backend (the
      # Dockerfile supervisor launches gunicorn on 127.0.0.1:8081
      # in the background). Astro's backendFetch() targets this URL
      # directly for server-side calls (Astro pages, BFF routes).
      #
      # /auth/webauthn/*, /users/*, /webauthn/*, and /health are
      # browser-callable (e.g. SecurityContent.tsx passkey UI). These
      # are proxied by Astro middleware to BACKEND_URL in production
      # (vite proxy handles dev). /auth/login stays on Astro per
      # the slice-19 runbook §7 option B (Astro owns it server-side
      # via backendFetch).
      - BACKEND_URL=http://127.0.0.1:8081
      # ─── Secrets (sourced from /opt/castor/.user/.secrets.env on
      # apollo; values here are placeholders — Docker compose reads
      # from the env_file below in production). DO NOT commit real
      # secrets to this file. ───────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET}
      - RESET_PASSWORD_TOKEN_SECRET=${RESET_PASSWORD_TOKEN_SECRET}
      - NICEGUI_STORAGE_SECRET=${NICEGUI_STORAGE_SECRET}
    env_file:
      - ./.user/.secrets.env   # optional: if present, overrides above
    volumes:
      - castor_data:/app/.user/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  castor_data:
    external: true