[project]
authors = [
    {name = "Henry Zhu", email = "daya0576@gmail.com"},
]
name = "castor"
dynamic = ["version"]
requires-python = "<4.0,>=3.12"
dependencies = [
    "nicegui[redis]>=3.13.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "fastapi-users[sqlalchemy]>=15.0.0,<16.0.0",
    "webauthn>=3.0.0,<4.0.0",
    "user-agents>=2.2.0",
    "tinycss2>=1.5.1,<2",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "sqlalchemy[asyncio]<3.0.0,>=2.0.29",
    "asyncpg<1.0.0,>=0.29.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "pytz<2025.0,>=2024.1",
    "python-dateutil<3.0.0.0,>=2.9.0.post0",
    "loguru>=0.7.3",
    "cachetools>=5.5.1",
    "jinja2>=3.1.6",
    "dataclasses-json>=0.6.7",
    "psutil>=7.0.0",
    "uvicorn-worker>=0.3.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.4",
    "httpx[socks]>=0.28.1",
]
description = ""
readme = "README.md"

# F25: `paddle_billing` and `sentry_sdk` were imported by the app but declared
# nowhere, so setting SENTRY_DSN or ENABLE_PLAN produced a ModuleNotFoundError
# at import time — a hard boot crash triggered by turning on error reporting.
# The code now degrades gracefully, but a graceful message that names a
# non-existent extra is just a slower dead end: declare them properly so the
# operator can actually install them.
#
# This is an extra rather than a hard dependency so a deployment that never
# enables Sentry does not pay for it, and so a failed install cannot break the
# build. `uv sync --extra sentry` is what the runtime error message tells the
# operator to run.
#
# Paddle is deliberately NOT declared. The `paddle_billing` import was already
# removed at slice 30; the surviving references (ENABLE_PLAN, get_customer_list)
# are plain SQLAlchemy, and `paddle-billing` is not resolvable from PyPI, so
# declaring it would only break `uv lock`. Nothing imports it any more.
[project.optional-dependencies]
sentry = [
    "sentry-sdk>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "icecream<3.0.0,>=2.1.3",
    "autopep8<3.0.0,>=2.0.4",
    "pytest-selenium<5.0.0,>=4.1.0",
    "webdriver-manager<5.0.0,>=4.0.1",
    "selenium<5.0.0,>=4.18.1",
    "beautifulsoup4<5.0.0,>=4.12.3",
    "pytest<9.0.0,>=8.1.1",
    "pip>=24.3.1",
    "psutil>=6.1.1",
    "black>=25.1.0",
    "pympler>=1.1",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
main = "castor.routes:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
